<body>
  <canvas class="park" aria-hidden="true"></canvas>
  <div class="anchors" aria-hidden="true"></div>

  <a class="brand" href="./"><img class="brand__mark" src="img/brand/athena-96.webp" alt="" width="56" height="96">Athena</a>

  <!-- The start of the flow: a few shapes in a calm field and the name; going on (wheel, swipe, keys,
       «Avanti») the shapes become the things of the park, the name goes to its corner, the way forks
       (on into the park, or aside to all the works on one page), and the park takes shape. -->
  <div class="threshold" id="threshold">
    <div class="threshold__forma"></div>
    <h1 class="threshold__name"><img class="threshold__mark" src="img/brand/athena-512.webp" alt="" width="301" height="512"><span class="threshold__word">Athena</span><span class="threshold__by">di Federico Mascia</span></h1>
    <div class="threshold__bivio">
      <button class="bivio bivio--parco threshold__enter" type="button"><img src="img/door/via-parco.webp" alt="" width="384" height="384"><span>Continua: entra nel parco</span></button>
      <a class="bivio bivio--lavori" href="veloce/"><img src="img/door/via-lavori.webp" alt="" width="384" height="384"><span>Tutti i lavori in una pagina</span></a>
    </div>
    <div class="threshold__piede">
      <button class="threshold__avanti" type="button" aria-keyshortcuts="Space"><strong>Avanti</strong><span class="threshold__verso">scorri</span></button>
      <button class="threshold__sound" type="button" role="switch" aria-checked="true"><span class="sound__dot" aria-hidden="true"></span>Suono</button>
    </div>
  </div>

  <div class="hud">
    <button class="sound" type="button" role="switch" aria-checked="false">
      <span class="sound__dot" aria-hidden="true"></span><span class="sound__label">Suono</span><span class="sound__state">spento</span>
    </button>
    <button class="above" type="button" aria-pressed="false" aria-keyshortcuts="M">Dall’alto</button>
    <a class="fast" href="veloce/">Versione veloce</a>
  </div>
  <p class="hint" hidden></p>

  <nav class="list" aria-label="Tutti i lavori"></nav>

  <section class="story" role="dialog" aria-modal="true" aria-label="Lavoro da vicino" hidden></section>
  <div class="travel"></div>
